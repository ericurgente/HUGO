<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hugo López</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Display: Arketta (licencia pendiente) — de momento cae en Zilla Slab. */
  :root{--bone:#fff;--dark:#0b0b0b;--fade:#8f8d87;
    --ft:'Arketta','Zilla Slab',Georgia,serif;--fm:'Space Mono',monospace;}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:auto}
  body{font-family:var(--ft);background:var(--dark);color:var(--bone);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  a:hover{color:var(--bone)}

  nav.topnav{position:fixed;top:32px;right:40px;z-index:30;text-align:right;padding:14px 18px 16px;
    background:linear-gradient(180deg,rgba(11,11,11,.62),rgba(11,11,11,.42));backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .45s ease}
  nav.topnav.on{opacity:1;pointer-events:auto}
  .navlbl{font-family:var(--fm);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(255,255,255,.8);display:block;margin-bottom:10px;text-shadow:0 1px 12px rgba(0,0,0,.8)}
  .worklist{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .worklist a{font-family:var(--fm);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    border-bottom:1px solid transparent;padding-bottom:2px;text-shadow:0 1px 12px rgba(0,0,0,.85);transition:border-color .2s}
  .worklist a:hover{border-color:var(--bone)}
  .sig{position:fixed;left:40px;top:34px;z-index:30;font-family:var(--fm);font-size:11px;
    letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.72)}

  /* ---------- 01 · la línea ---------- */
  .hero{position:relative;height:100vh;height:100svh;display:flex;align-items:center;overflow:hidden}
  .film{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:grayscale(1) contrast(1.12) brightness(.52);z-index:0}
  .veil{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 50%,rgba(11,11,11,.32) 0%,rgba(11,11,11,.82) 100%)}
  .rule{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.28);z-index:2}
  .line{position:relative;z-index:2;white-space:nowrap;display:flex;text-transform:uppercase;font-weight:600;
    font-size:clamp(64px,15vw,230px);line-height:1;letter-spacing:-.02em;
    text-shadow:0 4px 40px rgba(0,0,0,.75);
    animation:slide 44s linear infinite;will-change:transform}
  .line span{padding-right:.5em;display:inline-block}
  .line em{font-style:normal;-webkit-text-stroke:1px rgba(255,255,255,.72);color:transparent}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .ruler{position:absolute;left:0;right:0;bottom:0;height:44px;display:block;z-index:3;
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 22px);
    background-position:bottom;background-size:auto 11px;background-repeat:repeat-x}
  .ruler::after{content:"";position:absolute;left:0;bottom:0;width:0;height:22px;
    background-image:repeating-linear-gradient(90deg,var(--bone) 0 1px,transparent 1px 22px);
    animation:measure 5.5s cubic-bezier(.5,0,.3,1) infinite}
  .ruler:hover::after{animation-play-state:paused;width:34%}
  @keyframes measure{0%{width:0}55%{width:26%}100%{width:0}}
  @media(max-width:860px){.ruler{height:38px}}
  @media(prefers-reduced-motion:reduce){.ruler::after{animation:none;width:26%}}

  /* ---------- 02 · el menú ---------- */
  .menu{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:14vh 40px 12vh;
    border-top:1px solid rgba(255,255,255,.14)}
  .inner{width:100%;max-width:1100px;margin:0 auto}
  .lbl{font-family:var(--fm);font-size:10px;letter-spacing:.24em;text-transform:uppercase;
    color:rgba(255,255,255,.4);margin-bottom:28px}
  .idx a{display:flex;align-items:baseline;gap:28px;padding:24px 0;border-top:1px solid rgba(255,255,255,.16);
    transition:padding-left .35s cubic-bezier(.16,.78,.2,1),background .25s}
  .idx a:last-of-type{border-bottom:1px solid rgba(255,255,255,.16)}
  .idx a:hover{padding-left:22px;background:rgba(255,255,255,.04)}
  .n{font-family:var(--fm);font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.4);flex:none;width:3ch}
  .t{text-transform:uppercase;font-weight:600;font-size:clamp(34px,6vw,84px);line-height:.98;letter-spacing:-.02em}
  .m{margin-left:auto;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.4);white-space:nowrap}
  .contact{margin-top:56px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
    font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fade)}
  .contact a{border-bottom:1px solid transparent;padding-bottom:2px;transition:color .2s,border-color .2s}
  .contact a:hover{color:var(--bone);border-color:var(--bone)}

  @media(max-width:860px){
    nav.topnav{top:18px;right:18px}.sig{left:22px;top:22px}
    .menu{padding:12vh 22px 10vh}.m{display:none}
  }
  @media(prefers-reduced-motion:reduce){.line{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="sig">Hugo López</div>
<nav class="topnav" id="topnav">
  <a class="navlbl" href="#menu">Menu</a>
  <div class="worklist">
    <a href="manifesto.html">Manifesto</a>
    <a href="about.html">About me</a>
    <a href="work.html">Work</a>
  </div>
</nav>

<section class="hero">
  <video class="film" id="film" src="assets/landing-street.mp4" autoplay muted playsinline preload="auto" aria-hidden="true"></video>
  <div class="veil"></div>
  <div class="rule"></div>
  <div class="line">
    <span>Brand</span><span><em>Culture</em></span><span>Strategy</span><span><em>Sound</em></span>
    <span>Brand</span><span><em>Culture</em></span><span>Strategy</span><span><em>Sound</em></span>
  </div>
  <a class="ruler" href="#menu" aria-label="Index"></a>
</section>

<section class="menu" id="menu">
  <div class="inner">
    <p class="lbl">Index</p>
    <div class="idx">
      <a href="manifesto.html"><span class="n">01</span><span class="t">Manifesto</span><span class="m">Why</span></a>
      <a href="about.html"><span class="n">02</span><span class="t">About me</span><span class="m">Who</span></a>
      <a href="work.html"><span class="n">03</span><span class="t">Work</span><span class="m">What</span></a>
    </div>
    <div class="contact">
      <a href="mailto:hugolgromero@gmail.com">hugolgromero@gmail.com</a>
      <a href="https://www.linkedin.com/in/hugo-lopez-gonzalez-801a89213/" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
</section>

<script>
(function(){
  var n=document.getElementById('topnav'), q=false;
  function upd(){ n.classList.toggle('on', scrollY > innerHeight*0.55); }
  addEventListener('scroll',function(){ if(q) return; q=true;
    requestAnimationFrame(function(){ q=false; upd(); }); },{passive:true});
  if(location.hash==='#menu'){var mm=document.getElementById('menu');if(mm)scrollTo(0,mm.offsetTop);}
  document.querySelectorAll('a[href="#menu"]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var mm=document.getElementById('menu');scrollTo({top:mm.offsetTop,behavior:'smooth'});});});
  upd();

  /* ping-pong: al terminar rebobina encadenando seeks (un seek por frame de
     animacion cancelaria el anterior y el decodificador nunca pintaria) */
  var v=document.getElementById('film'), back=false, STEP=1/15;
  function step(){
    if(!back) return;
    var next=v.currentTime-STEP;
    if(next<=0.03){ back=false; v.currentTime=0; v.play().catch(function(){}); return; }
    v.currentTime=next;
  }
  v.addEventListener('seeked',function(){ if(back) step(); });
  v.addEventListener('ended',function(){
    back=true; v.pause(); step();
  });
  v.play().catch(function(){});
})();
</script>
</body>
</html>
