<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manifesto — Hugo López</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bone:#ffffff; --ink:#15140f; --dark:#0e0d0b; --bonefade:#a39e90;
    --font-title:'Anzeige Grotesk','Archivo Black',sans-serif; --font-body:'Archivo',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:var(--font-body);color:var(--bone);background:var(--dark);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100vh}
  a{color:inherit;text-decoration:none}
  a:hover{color:var(--bone)}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:32px 5vw;flex-wrap:wrap}
  .home{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--bonefade);
    border-bottom:1px solid transparent;padding-bottom:2px;transition:color .2s,border-color .2s}
  .home:hover{color:var(--bone);border-color:var(--bone)}
  nav{display:flex;gap:22px;flex-wrap:wrap}
  nav a{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--bonefade);border-bottom:1px solid transparent;padding-bottom:2px;transition:color .2s,border-color .2s}
  nav a:hover{color:var(--bone);border-color:var(--bone)}
  nav a[aria-current]{color:var(--bone);border-color:var(--bone)}
  main{flex:1;padding:6vh 5vw 10vh;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--bonefade)}
  h1{font-family:var(--font-title);text-transform:uppercase;line-height:.92;letter-spacing:-.025em;
    font-size:clamp(46px,9vw,140px);margin-top:20px}
  .soon{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--bonefade);margin-top:34px;padding-top:26px;border-top:1px solid rgba(255,255,255,.14);max-width:40ch}
  footer{padding:0 5vw 6vh;display:flex;gap:24px;flex-wrap:wrap;
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bonefade)}
  footer a{border-bottom:1px solid transparent;padding-bottom:2px;transition:color .2s,border-color .2s}
  footer a:hover{color:var(--bone);border-color:var(--bone)}
  @media(max-width:900px){
    header{padding:22px 7vw}
    main{padding:5vh 7vw 8vh}
    footer{padding:0 7vw 5vh}
  }
</style>
</head>
<body>
<header>
  <a class="home" href="index.html#menu">Hugo López — Index</a>
  <nav>
    <a href="manifesto.html" aria-current="page">Manifesto</a>
    <a href="about.html">About me</a>
    <a href="work.html">Work</a>
  </nav>
</header>
<main>
  <div class="eyebrow">01 — Manifesto</div>
  <h1>Manifesto</h1>
  <p class="soon">Contenido en preparación.</p>
</main>
<footer>
  <a href="mailto:hugolgromero@gmail.com">hugolgromero@gmail.com</a>
  <a href="https://www.linkedin.com/in/hugo-lopez-gonzalez-801a89213/" target="_blank" rel="noopener">LinkedIn</a>
</footer>
</body>
</html>
